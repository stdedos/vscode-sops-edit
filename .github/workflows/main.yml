name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # https://github.com/actions/checkout/issues/1471
        filter: tree:0

    - name: Generate CI version
      run: |
        sed -i "s/\"version\": \".*\"/\"version\": \"$(git describe --tags --always)\"/" package.json
      shell: bash

    - uses: ./.github/workflows/build-and-test
