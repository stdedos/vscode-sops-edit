name: 'Build and Test'
description: 'Build and run tests'
runs:
  using: 'composite'
  steps:
  - name: Install Node.js
    uses: actions/setup-node@v3
    with:
      node-version: 16.x
  - run: npm install
    shell: bash

  - run: npm x vsce package
    shell: bash

  - run: xvfb-run -a npm test
    if: runner.os == 'Linux'
    shell: bash
  - run: npm test
    if: runner.os != 'Linux'
    shell: bash

  - name: Create artifact name
    uses: sergeysova/jq-action@v2
    id: artifact_name
    with:
      cmd: jq -r '"\(.name)-\(.version)-${{ runner.os }}.vsix"' package.json

  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: ${{ steps.artifact_name.outputs.value }}
      path: |
        *.vsix
      if-no-files-found: error
